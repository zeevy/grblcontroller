# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
permissions:
  contents: read
  statuses: write

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "master"
          # docs/js and docs/css hold third party libraries, not our code
          FILTER_REGEX_EXCLUDE: .*docs/(js|css)/.*
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # the release workflows share their setup steps on purpose
          VALIDATE_JSCPD: false
          # the Java code follows Android Studio style, not Google Java style
          VALIDATE_GOOGLE_JAVA_FORMAT: false
          # checkstyle enforces Sun style (80 char lines, javadoc on every field), which this code does not follow
          VALIDATE_JAVA: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
